<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KRONOS — LIVE 3D CIMÁTICO ◍</title>
  <meta name="description" content="Lienzo cimático en vivo — KRONOS-28-ITZA-CYMATIC-ELITE" />
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <style>
    :root {
      --bg: #0a0a0a;
      --fg: #e8e8e8;
      --accent: #d4af37;
      --border: #222;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      overflow: hidden;
      font-family: ui-monospace, monospace;
    }
    #canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #hud {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10;
      border: 1px solid var(--border);
      background: rgba(17,17,17,0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 12px 16px;
      border-radius: 12px;
      color: var(--fg);
      pointer-events: none;
      user-select: none;
    }
    #hud h1 {
      font-size: 12px;
      letter-spacing: 0.1em;
      color: var(--accent);
      font-weight: 400;
    }
    #hud p {
      font-size: 11px;
      color: #888;
      margin-top: 4px;
    }
    #status-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4caf50;
      margin-right: 6px;
      vertical-align: middle;
      transition: background 0.3s ease;
    }
    #status-indicator.paused {
      background: #f44336;
    }
    #controls {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      border: 1px solid #333;
      background: #111;
      color: #ccc;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: 0.08em;
      cursor: pointer;
      font-family: inherit;
      transition: border-color 0.2s, color 0.2s, background 0.2s, transform 0.1s;
      min-width: 80px;
    }
    .btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: scale(1.02);
    }
    .btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }
    .btn-secondary {
      border-color: #444;
      color: #888;
    }
    .btn-secondary:hover {
      border-color: var(--fg);
      color: var(--fg);
    }
    #fps-counter {
      position: fixed;
      bottom: 80px;
      right: 16px;
      z-index: 10;
      font-size: 10px;
      color: #444;
      font-family: monospace;
      pointer-events: none;
    }
    @media (max-width: 480px) {
      #hud { top: 12px; left: 12px; padding: 10px 14px; }
      #hud h1 { font-size: 10px; }
      #hud p { font-size: 10px; }
      .btn { padding: 8px 14px; font-size: 10px; min-width: 60px; }
      #controls { gap: 6px; bottom: 16px; }
    }
  </style>
</head>
<body>
  <canvas id="canvas" role="img" aria-label="Visualización cimática en vivo de KRONOS"></canvas>

  <div id="hud" aria-hidden="true">
    <h1>◍ KRONOS-28-ITZA LIVE 3D</h1>
    <p>
      <span id="status-indicator"></span>
      <span id="status-text">CIMÁTICA — 60 FPS</span>
    </p>
  </div>

  <div id="controls">
    <button class="btn active" id="btn-play" aria-label="Pausar o reanudar animación">◍ PAUSA</button>
    <button class="btn btn-secondary" id="btn-clear" aria-label="Limpiar el lienzo">LIMPIAR</button>
    <button class="btn btn-secondary" id="btn-back" aria-label="Volver al inicio" onclick="location.href='./index.html'">SALIR</button>
  </div>

  <div id="fps-counter" aria-hidden="true"></div>

  <script type="module">
    // ─── KRONOS LIVE3D — Placeholder cimático v0.3.0 ───
    // Reemplazar con Three.js + shaders cuando esté listo.
    
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status-text');
    const statusIndicator = document.getElementById('status-indicator');
    const fpsCounter = document.getElementById('fps-counter');

    // ─── Dimensiones ───
    function resize() {
      const dpr = Math.min(devicePixelRatio, 2);
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      canvas.style.width = rect.width + 'px';
      canvas.style.height = rect.height + 'px';
      // ✅ Fix: resetear transform en lugar de acumular scale
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener('resize', resize);

    // ─── Estado ───
    let time = 0;
    let playing = true;
    let lastTimestamp = 0;
    let frameCount = 0;
    let fps = 60;

    // ─── Dibujo ───
    function draw(timestamp) {
      if (!playing) {
        requestAnimationFrame(draw);
        return;
      }

      const delta = Math.min((timestamp - lastTimestamp) / 1000, 0.05);
      if (delta > 0) {
        time += delta * 1.5;
        frameCount++;
        if (timestamp - lastTimestamp > 1000) {
          fps = frameCount;
          frameCount = 0;
          fpsCounter.textContent = `FPS: ${fps}`;
        }
      }
      lastTimestamp = timestamp;

      const w = canvas.width / Math.min(devicePixelRatio, 2);
      const h = canvas.height / Math.min(devicePixelRatio, 2);

      ctx.fillStyle = '#0a0a0a';
      ctx.fillRect(0, 0, w, h);

      const cx = w / 2;
      const cy = h / 2;
      const maxRadius = Math.min(w, h) * 0.45;

      for (let i = 0; i < 8; i++) {
        const phase = i / 8;
        const radius = (Math.sin(time * 1.2 + phase * Math.PI * 2) * 0.4 + 0.6) * maxRadius * 0.7 + i * 12;
        const alpha = 0.08 - i * 0.008;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.strokeStyle = '#d4af37';
        ctx.globalAlpha = Math.max(alpha, 0.01);
        ctx.lineWidth = 1.2;
        ctx.stroke();
      }

      ctx.globalAlpha = 0.8;
      ctx.fillStyle = '#d4af37';
      ctx.beginPath();
      ctx.arc(cx, cy, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;

      requestAnimationFrame(draw);
    }

    // ─── Controles ───
    const btnPlay = document.getElementById('btn-play');
    const btnClear = document.getElementById('btn-clear');

    btnPlay.addEventListener('click', () => {
      playing = !playing;
      btnPlay.textContent = playing ? '◍ PAUSA' : '▶ REANUDAR';
      btnPlay.classList.toggle('active');
      statusIndicator.classList.toggle('paused', !playing);
      statusText.textContent = playing ? 'CIMÁTICA — 60 FPS' : 'PAUSADO';
      if (playing) {
        lastTimestamp = performance.now();
        requestAnimationFrame(draw);
      }
    });

    btnClear.addEventListener('click', () => {
      time = 0;
      ctx.fillStyle = '#0a0a0a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    });

    // ─── Iniciar ───
    lastTimestamp = performance.now();
    requestAnimationFrame(draw);

    // ─── Estado inicial ───
    statusIndicator.classList.remove('paused');
    statusText.textContent = 'CIMÁTICA — 60 FPS';

    console.log('◍ KRONOS LIVE 3D v0.3.0 — Placeholder cimático listo');
    console.log('📡 Reemplazar con Three.js + shaders en producción.');
  </script>
</body>
</html>
