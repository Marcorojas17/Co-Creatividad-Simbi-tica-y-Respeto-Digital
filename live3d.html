<!DOCTYPE html>
<html lang="es-MX">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LIVE 3D ◍ KRONOS</title><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./design-system/glass.css">
<style>body{background:#07111f;margin:0;overflow:hidden}canvas{display:block}</style>
</head>
<body><canvas id="c"></canvas>
<div id="ui" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:10;background:rgba(7,17,31,0.62);backdrop-filter:blur(18px);border:1px solid rgba(214,168,79,0.18);border-radius:999px;padding:8px 16px;display:flex;gap:10px">
  <a href="./index.html" style="color:#d6a84f;text-decoration:none;padding:8px 16px;border:1px solid #d6a84f;border-radius:999px">INDEX</a>
  <a href="./live.html" style="color:#aaa;text-decoration:none;padding:8px 16px;border:1px solid #333;border-radius:999px">LIVE</a>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x07111f);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,100);
camera.position.set(0,1.2,3.2);
camera.lookAt(0,0,0);
const geo=new THREE.PlaneGeometry(8,8,128,128);
const mat=new THREE.ShaderMaterial({
  uniforms:{uTime:{value:0},uColor:{value:new THREE.Color(0xd6a84f)}},
  vertexShader:`uniform float uTime; varying vec2 vUv; varying float vH; void main(){vUv=uv; vec3 p=position; float d=length(p.xy); p.z+=sin(d*3.0-uTime*1.2)*0.25+sin(d*6.0-uTime*2.0+p.x*1.5)*0.12+cos(d*2.0+uTime*0.8)*0.18*exp(-d*0.6); vH=p.z; gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);}`,
  fragmentShader:`uniform vec3 uColor; varying float vH; void main(){float h=clamp(vH*1.5+0.5,0.0,1.0); vec3 col=mix(vec3(0.03),uColor,h*0.7+0.1); gl_FragColor=vec4(col,0.85);}`
});
const mesh=new THREE.Mesh(geo,mat);
mesh.rotation.x=-0.42;
scene.add(mesh);
let t=0;
function animate(){t+=0.008; mat.uniforms.uTime.value=t; mesh.rotation.z=Math.sin(t*0.15)*0.08; camera.position.x=Math.sin(t*0.12)*0.15; camera.lookAt(0,0,0); renderer.render(scene,camera); requestAnimationFrame(animate);}
animate();
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});
</script></body>
</html>
