<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;background:#020208;color:#ffd700;font-family:sans-serif}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:28px;padding:40px;max-width:1600px;margin:0 auto}
.card{border:1px solid #d4af37;border-radius:22px;padding:28px;background:radial-gradient(120% 120% at 50% 0%,#1e1e1e,#000);box-shadow:0 0 30px rgba(212,175,55,0.15);transition:0.3s}
.card:hover{transform:scale(1.02);box-shadow:0 0 60px gold}
.card h2{letter-spacing:0.3em;font-size:1rem}
.visual{height:280px;margin:22px 0;border-radius:50%;background:conic-gradient(from 0deg,gold,#fff,gold);filter:drop-shadow(0 0 30px gold);animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#micBtn{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);padding:18px 36px;border-radius:40px;border:2px solid gold;background:#000;color:gold;letter-spacing:0.3em;cursor:pointer;z-index:99}
</style></head><body>
<div class="grid">
<div class="card" data-min="1"><h2>MIN1 - SAND COIN</h2><div class="visual" style="background:radial-gradient(circle,#c2a86a,#8b7355)"></div><p>COMMON • 1,024 SUPPLY<br>Rarity: Graves 432Hz</p></div>
<div class="card" data-min="2"><h2>MIN2 - CRYSTAL MERKABA</h2><div class="visual" style="background:conic-gradient(cyan,white,cyan);clip-path:polygon(50% 0%,0% 100%,100% 100%)"></div><p>RARE • 512 SUPPLY<br>Rarity: Medios 528Hz</p></div>
<div class="card" data-min="3"><h2>MIN3 - QUANTUM TUNNEL</h2><div class="visual" style="background:radial-gradient(circle,black,cyan,black)"></div><p>EPIC • 256 SUPPLY<br>Rarity: Agudos 963Hz</p></div>
<div class="card" data-min="4"><h2>MIN4 - LIQUID MERCURY</h2><div class="visual" style="background:radial-gradient(circle,silver,white,silver)"></div><p>LEGENDARY • 128 SUPPLY<br>Rarity: Grave+Agudo</p></div>
</div>
<button id="micBtn" onclick="autoChoose()">🎤 QUE TU MÚSICA ELIJA POR TI</button>
<script>
async function autoChoose(){
 const s=await navigator.mediaDevices.getUserMedia({audio:true});
 const ac=new AudioContext(), an=ac.createAnalyser(); ac.createMediaStreamSource(s).connect(an); an.fftSize=512;
 const d=new Uint8Array(an.frequencyBinCount);
 setInterval(()=>{an.getByteFrequencyData(d); let bass=d.slice(0,15).reduce((a,b)=>a+b)/15; let high=d.slice(100,180).reduce((a,b)=>a+b)/80;
 document.querySelectorAll('.card').forEach(c=>c.style.boxShadow='none');
 if(bass>110) document.querySelector('[data-min=\"1\"]').style.boxShadow='0 0 70px gold';
 if(bass>70&&high>70) document.querySelector('[data-min=\"4\"]').style.boxShadow='0 0 70px silver';
 if(high>110) document.querySelector('[data-min=\"3\"]').style.boxShadow='0 0 70px cyan';
 if(bass<70&&high<70) document.querySelector('[data-min=\"2\"]').style.boxShadow='0 0 70px white';
 },100);
}
document.querySelectorAll('.card').forEach(c=>c.onclick=()=>location.href=`certificado.html?min=${c.dataset.min}&code=KRONOS-GATO-0${c.dataset.min}-${Math.random().toString(36).substr(2,6).toUpperCase()}`);
</script>
</body></html>
