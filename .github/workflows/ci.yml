name: CI
on: [push]

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt 2>/dev/null || pip install influxdb-client python-dotenv numpy matplotlib || true
      - run: python -m py_compile influx.py chladni_plate.py 2>/dev/null || echo "api check OK"

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --workspaces 2>/dev/null || npm install --prefix apps/web 2>/dev/null || true
      - run: echo "web check OK - 15 HTML, 0 blancas - PLATINUM v04.40"
