<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flower 2099 Legacy of Life - Audio Reactive</title>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<style>
body{margin:0;background:#000;overflow:hidden;font-family:Inter}
.top{position:fixed;top:0;left:0;right:0;height:48px;display:flex;justify-content:space-between;align-items:center;padding:0 16px;z-index:10;background:linear-gradient(180deg,rgba(0,0,0,0.8),transparent)}
.text{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);text-align:center;z-index:10}
.text small{display:block;color:#fff;letter-spacing:4px;font-size:12px;opacity:0.8}
.text b{display:block;color:#D4AF37;font-size:38px;font-weight:300;letter-spacing:1px;margin-top:4px;text-shadow:0 0 20px rgba(212,175,55,0.5)}
.ctrl{position:fixed;left:12px;top:60px;width:280px;background:rgba(0,0,0,0.7);border:1px solid rgba(212,175,55,0.2);border-radius:12px;padding:12px;z-index:10}
.btn{width:100%;padding:10px;border-radius:20px;border:1px solid #D4AF37;background:linear-gradient(90deg,#D4AF37,#F5D76E);color:#000;font-weight:700;cursor:pointer;margin:5px 0;font-size:11px}
</style></head><body>
<div class="top">
<div style="color:#D4AF37;font-weight:700;letter-spacing:3px">Co-Creatividad</div>
<div style="color:#00aaff;border:1px solid #00aaff;padding:4px 10px;border-radius:20px;font-size:10px">● FLOWER 2099 • LEGACY OF LIFE</div>
<div style="display:flex;gap:10px"><a href="./index.html" style="color:#666;text-decoration:none;font-size:11px">INDEX</a></div>
</div>

<div class="ctrl">
<button class="btn" id="micBtn">🎤 MIC - VOZ CREA VIDA</button>
<label class="btn" style="display:block;text-align:center;background:transparent;color:#D4AF37;border-color:rgba(212,175,55,0.4)">📁 MP3 MP3<input type="file" id="file" accept=".mp3,.wav,.ogg" style="display:none"></label>
<audio id="audio" controls style="width:100%;margin-top:8px;display:none"></audio>
<div style="font-size:9px;color:#888;margin-top:8px">GRAVES=rotación jaula<br>MEDIOS=color líquido<br>AGUDOS=velocidad</div>
</div>

<div class="text"><small>Flower 2099</small><b>Legacy of Life</b></div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0,0,3.8);
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), 0.45, 0.3, 0.3));

// 1. FLOWER OF LIFE BLUE - exact like video
function makeFlower(){
  const g = new THREE.Group();
  const mat = new THREE.LineBasicMaterial({color:0x00ccff, transparent:true, opacity:0.9});
  const r=1;
  const centers=[[0,0],[1,0],[-1,0],[0.5,0.866],[-0.5,0.866],[0.5,-0.866],[-0.5,-0.866],
                 [1.5,0.866],[-1.5,0.866],[1.5,-0.866],[-1.5,-0.866],[0,1.732],[0,-1.732],[2,0],[-2,0]];
  centers.forEach(c=>{
    const curve = new THREE.EllipseCurve(c[0], c[1], r, r, 0, Math.PI*2, false, 0);
    const pts = curve.getPoints(64);
    const geo = new THREE.BufferGeometry().setFromPoints(pts.map(p=>new THREE.Vector3(p.x,p.y,-2)));
    g.add(new THREE.Line(geo, mat));
  });
  g.scale.setScalar(0.9);
  return g;
}
const flower = makeFlower();
scene.add(flower);

// 2. GOLD CAGE - Wireframe icosahedron thick gold like video
const cageGeo = new THREE.IcosahedronGeometry(0.9, 0);
const edges = new THREE.EdgesGeometry(cageGeo);
const cageMat = new THREE.LineBasicMaterial({color:0xD4AF37, linewidth:2});
const cage = new THREE.LineSegments(edges, cageMat);
// Make it thick using Tube along edges - fake thick with mesh
const cageMeshGeo = new THREE.IcosahedronGeometry(0.9,0);
const cageMeshMat = new THREE.MeshStandardMaterial({color:0xD4AF37, wireframe:true, metalness:0.8, roughness:0.2, emissive:0x332200, emissiveIntensity:0.2});
const cageThick = new THREE.Mesh(cageMeshGeo, cageMeshMat);
scene.add(cageThick);

// Inner second cage rotated - like video double layer
const cage2 = new THREE.Mesh(new THREE.IcosahedronGeometry(0.78,0), new THREE.MeshStandardMaterial({color:0xD4AF37, wireframe:true, metalness:0.9, roughness:0.15}));
cage2.rotation.y = Math.PI/5;
scene.add(cage2);

// 3. LIQUID CORE - Iridescent shader inside
const coreGeo = new THREE.SphereGeometry(0.58, 64, 64);
const coreMat = new THREE.ShaderMaterial({
  uniforms:{time:{value:0}, low:{value:0}, mid:{value:0}, high:{value:0}},
  vertexShader:`varying vec2 vUv; varying vec3 vN; void main(){vUv=uv; vN=normalize(normalMatrix*normal); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`
  varying vec2 vUv; varying vec3 vN; uniform float time; uniform float low; uniform float mid; uniform float high;
  void main(){
    vec2 uv = vUv;
    float r = length(uv-0.5);
    float angle = atan(uv.y-0.5, uv.x-0.5);
    // Psychedelic liquid like your video
    float swirl = sin(angle*3.0 + time*1.0 + low*5.0)*0.5 + cos(r*12.0 - time*2.0)*0.5;
    vec3 c1 = vec3(0.0,0.8,1.0);
    vec3 c2 = vec3(1.0,0.2,0.6);
    vec3 c3 = vec3(0.1,1.0,0.3);
    vec3 c4 = vec3(1.0,0.9,0.2);
    vec3 col = mix(c1,c2, sin(swirl*2.0+mid*3.0)*0.5+0.5);
    col = mix(col,c3, sin(swirl*3.0 + time)*0.5+0.5);
    col = mix(col,c4, high);
    // Iris effect like video
    float iris = 0.5 + 0.4*sin(r*18.0 - time*3.0 - mid*10.0);
    col *= iris;
    // Fresnel
    float fres = pow(1.0 - abs(dot(vN, vec3(0,0,1))), 3.0);
    col += fres*vec3(1.0,0.8,0.3)*0.6;
    gl_FragColor = vec4(col, 0.95);
  }`,
  transparent:true
});
const core = new THREE.Mesh(coreGeo, coreMat);
scene.add(core);

// Lights for stage spotlights like video
const spot1 = new THREE.SpotLight(0xffffff, 5, 10, Math.PI/8, 0.3, 1); spot1.position.set(2,3,2); scene.add(spot1);
const spot2 = new THREE.SpotLight(0xffffff, 5, 10, Math.PI/8, 0.3, 1); spot2.position.set(-2,3,2); scene.add(spot2);
scene.add(new THREE.AmbientLight(0x111122,0.8));
const goldLight = new THREE.PointLight(0xD4AF37, 1.2, 5); goldLight.position.set(0,0,1.5); scene.add(goldLight);

// Volumetric light beams fake
function makeBeam(x){
  const geo = new THREE.PlaneGeometry(0.4, 6);
  const mat = new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:0.08, side:THREE.DoubleSide});
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x,1,-1); m.rotation.z = -x*0.2;
  return m;
}
scene.add(makeBeam(1.2)); scene.add(makeBeam(-1.2)); scene.add(makeBeam(0.6)); scene.add(makeBeam(-0.6));

// AUDIO
let audioCtx, analyser, data;
const audioEl = document.getElementById('audio');
async function initAudio(src){
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser(); analyser.fftSize=256; data=new Uint8Array(analyser.frequencyBinCount);
  let source; if(src.mediaStream){ source=audioCtx.createMediaStreamSource(src.mediaStream); } else { source=audioCtx.createMediaElementSource(src); src.play(); }
  source.connect(analyser); analyser.connect(audioCtx.destination);
}
document.getElementById('micBtn').onclick = async()=>{ const s=await navigator.mediaDevices.getUserMedia({audio:true}); await initAudio({mediaStream:s}); document.getElementById('micBtn').textContent='● VIVO - HABLA Y CREA'; };
document.getElementById('file').onchange = e=>{ const f=e.target.files[0]; if(!f) return; audioEl.src=URL.createObjectURL(f); audioEl.style.display='block'; audioEl.onplay=async()=>{ if(!audioCtx) await initAudio(audioEl); }; audioEl.play(); };

function getBands(){ if(!analyser) return {l:0,m:0,h:0}; analyser.getByteFrequencyData(data); const l=data.slice(0,8).reduce((a,b)=>a+b,0)/8/255; const m=data.slice(8,40).reduce((a,b)=>a+b,0)/32/255; const h=data.slice(40,80).reduce((a,b)=>a+b,0)/40/255; return {l,m,h}; }

let t=0;
function anim(){ requestAnimationFrame(anim); t+=0.016;
  const {l,m,h}=getBands();
  coreMat.uniforms.time.value = t*(0.8 + h*2 + m);
  coreMat.uniforms.low.value=l; coreMat.uniforms.mid.value=m; coreMat.uniforms.high.value=h;

  if(analyser){
    cageThick.rotation.y = t*0.3 + l*0.8; cageThick.rotation.x = t*0.15 + m*0.5;
    cage2.rotation.y = -t*0.4 - m*0.6; cage2.rotation.x = -t*0.1 - l*0.3;
    core.rotation.y = t*0.5 + h;
    core.scale.setScalar(0.9 + l*0.4 + m*0.2);
    flower.rotation.z = t*0.05 + l*0.1;
    flower.scale.setScalar(0.9 + m*0.15);
  }else{
    // Idle like video
    cageThick.rotation.y = t*0.3; cage2.rotation.y = -t*0.25; core.rotation.y = t*0.4;
    flower.rotation.z = t*0.02;
  }
  composer.render();
}
anim();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);});
</script></body></html>
