<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LIVE 3D • CYMATIC</title><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script><style>body{margin:0;background:#080808;overflow:hidden;font-family:Inter} .top{position:fixed;top:10px;left:10px;right:10px;height:44px;display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,0.6);border:1px solid rgba(212,175,55,0.3);border-radius:12px;padding:0 16px;backdrop-filter:blur(10px);z-index:10} .panel{position:fixed;left:16px;top:70px;width:280px;background:rgba(0,0,0,0.7);border:1px solid rgba(212,175,55,0.2);border-radius:12px;padding:16px;color:#D4AF37;z-index:10} input{width:100%;accent-color:#D4AF37} .val{float:right;color:#fff}</style></head><body>
<div class="top"><div><b style="color:#D4AF37">● LIVE 3D</b> <span style="color:#666;font-size:11px">CYMATIC DISPLACEMENT • WEBGL</span></div><div><a href="./index.html" style="color:#D4AF37;text-decoration:none;font-size:12px">← INDEX</a></div></div>
<div class="panel"><div style="font-size:11px;letter-spacing:2px;margin-bottom:12px">CYMATIC CONTROLS</div>FREQUENCY <span class="val" id="vF">42.3 Hz</span><input id="f" type="range" min="10" max="440" value="42.3" step="0.1"><br><br>AMPLITUDE <span class="val" id="vA">0.78</span><input id="a" type="range" min="0" max="2" step="0.01" value="0.78"><br><br>COMPLEXITY <span class="val" id="vC">6</span><input id="c" type="range" min="1" max="10" value="6"><br><br>FPS: <span id="fps" style="color:#7CFC8A">60</span></div>
<script type="module">import * as THREE from 'three'; const scene=new THREE.Scene(); const cam=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,100); cam.position.set(0,2,3); const ren=new THREE.WebGLRenderer({antialias:true}); ren.setSize(innerWidth,innerHeight); document.body.appendChild(ren.domElement); const geo=new THREE.PlaneGeometry(4,4,128,128); const mat=new THREE.MeshStandardMaterial({color:0xD4AF37,wireframe:true}); const mesh=new THREE.Mesh(geo,mat); mesh.rotation.x=-Math.PI/2.5; scene.add(mesh); scene.add(new THREE.DirectionalLight(0xD4AF37,1)); scene.add(new THREE.AmbientLight(0x555555)); let freq=42.3, amp=0.78, comp=6; function anim(t){requestAnimationFrame(anim); const p=geo.attributes.position; for(let i=0;i<p.count;i++){const x=p.getX(i), y=p.getY(i); let z=0; for(let k=1;k<=comp;k++) z+=Math.sin(x*k*0.5+t*0.0005*freq)*Math.cos(y*k*0.5+t*0.0005*freq)*amp/k; p.setZ(i,z);} p.needsUpdate=true; geo.computeVertexNormals(); ren.render(scene,cam);} anim(0); document.getElementById('f').oninput=e=>{freq=parseFloat(e.target.value); document.getElementById('vF').textContent=freq+' Hz'}; document.getElementById('a').oninput=e=>{amp=parseFloat(e.target.value); document.getElementById('vA').textContent=amp}; document.getElementById('c').oninput=e=>{comp=parseInt(e.target.value); document.getElementById('vC').textContent=comp}; addEventListener('resize',()=>{ren.setSize(innerWidth,innerHeight); cam.aspect=innerWidth/innerHeight; cam.updateProjectionMatrix()});</script></body></html>
