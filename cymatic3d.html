<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FLOWER 2099 • KIFOS BIO-DIGITAL V7</title>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<style>
body{margin:0;background:#020205;overflow:hidden;font-family:Inter;color:#D4AF37}
.top{position:fixed;top:0;left:0;right:0;height:50px;display:flex;justify-content:space-between;align-items:center;padding:0 14px;background:rgba(0,0,0,0.75);backdrop-filter:blur(12px);border-bottom:1px solid rgba(212,175,55,0.2);z-index:10}
.ctrl{position:fixed;left:10px;top:62px;width:290px;background:rgba(0,0,0,0.78);border:1px solid rgba(212,175,55,0.25);border-radius:14px;padding:12px;z-index:10;backdrop-filter:blur(14px)}
.btn{width:100%;padding:10px;border-radius:22px;border:1px solid #D4AF37;background:linear-gradient(90deg,#D4AF37,#F5D76E);color:#000;font-weight:800;cursor:pointer;margin:5px 0;font-size:11px;letter-spacing:1px}
.bar{height:4px;background:#111;border-radius:2px;overflow:hidden;margin:4px 0}
.bar div{height:100%;width:0%;background:linear-gradient(90deg,#00aaff,#D4AF37)}
.legacy{position:fixed;right:10px;top:50%;transform:translateY(-50%) rotate(180deg);writing-mode:vertical-rl;letter-spacing:3px;font-size:10px;opacity:0.6}
.txt{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);text-align:center;z-index:10}
.txt small{color:#fff;letter-spacing:4px;font-size:11px;opacity:0.7;display:block}
.txt b{color:#D4AF37;font-size:36px;font-weight:300}
</style></head><body>
<div class="top">
<div style="font-weight:800;letter-spacing:3px">Co-Creatividad</div>
<div style="border:1px solid #D4AF37;padding:4px 10px;border-radius:20px;font-size:10px">● V7 BIO-DIGITAL • SOUND BREEDS LIFE</div>
<div><a href="./index.html" style="color:#888;text-decoration:none;font-size:11px">INDEX</a></div>
</div>

<div class="ctrl">
<button class="btn" id="micBtn">🎤 MIC - CREA VIDA</button>
<label class="btn" style="display:block;text-align:center;background:transparent;color:#D4AF37">📁 MP3 / WAV<input type="file" id="file" accept=".mp3,.wav,.ogg,.m4a" style="display:none"></label>
<audio id="audio" controls style="width:100%;margin:6px 0;display:none"></audio>
<div style="font-size:9px">BASS (raíces) <div class="bar"><div id="bLow"></div></div></div>
<div style="font-size:9px">MID (ramas) <div class="bar"><div id="bMid"></div></div></div>
<div style="font-size:9px">HIGH (merkabitas) <div class="bar"><div id="bHigh"></div></div></div>
<div style="font-size:9px;margin-top:8px">VIDA: <b id="life" style="color:#7CFC8A">DORMANT</b> • HIJITOS: <b id="count">0</b></div>
<div style="font-size:8px;color:#666;margin-top:6px">528Hz = FLORECE • Ruido = MUERE • Om = RAÍCES</div>
</div>

<div class="legacy">Flower of Kifos Legacy 2099</div>
<div class="txt"><small>Flower 2099</small><b>Legacy of Life</b></div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const scene=new THREE.Scene(); scene.fog=new THREE.Fog(0x020205,4,16);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,100); camera.position.set(0,1.2,4.2);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=0.85; document.body.appendChild(renderer.domElement);

const composer=new EffectComposer(renderer); composer.addPass(new RenderPass(scene,camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.55,0.35,0.25));

// FLOOR - Golden transmutation
const floorG=new THREE.Group();
for(let r=0.6;r<4.5;r+=0.35){const ring=new THREE.RingGeometry(r,r+0.012,128); const m=new THREE.Mesh(ring,new THREE.MeshBasicMaterial({color:0xD4AF37,transparent:true,opacity:0.18 - r*0.02})); m.rotation.x=-Math.PI/2; m.position.y=-1.9; floorG.add(m);}
scene.add(floorG);

// CORE - Organic bio-digital with roots
const coreMat=new THREE.ShaderMaterial({
 uniforms:{time:{value:0},low:{value:0},mid:{value:0},high:{value:0}},
 vertexShader:`varying vec3 vP; varying vec3 vN; void main(){vP=position; vN=normal; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
 fragmentShader:`
 varying vec3 vP; varying vec3 vN; uniform float time; uniform float low; uniform float mid; uniform float high;
 void main(){
   float r=length(vP);
   float n=sin(vP.x*4.0+time*0.8)*sin(vP.y*4.0+time*0.6)*sin(vP.z*4.0+time);
   float veins=pow(abs(sin(vP.x*10.0+time)+sin(vP.y*10.0)),2.0);
   vec3 col=mix(vec3(0.05,0.15,0.35), vec3(0.9,0.75,0.2), low*1.2 + mid*0.5);
   col+=veins*vec3(0.2,0.9,1.0)* (0.5+mid);
   col+=vec3(1,1,1)*pow(n*0.5+0.5,8.0)*high*2.0;
   float fres=pow(1.0-dot(vN,vec3(0,0,1)),3.0); col+=fres*vec3(0.6,0.8,1)*0.8;
   gl_FragColor=vec4(col,1);
 }`
});
let coreGeo=new THREE.IcosahedronGeometry(0.85,3);
const core=new THREE.Mesh(coreGeo,coreMat); scene.add(core);
const origPos=coreGeo.attributes.position.array.slice();

// ROOTS - growing with bass
const roots=[];
for(let i=0;i<14;i++){
 const pts=[]; for(let j=0;j<20;j++) pts.push(new THREE.Vector3((Math.random()-0.5)*0.1, -j*0.08, (Math.random()-0.5)*0.1));
 const curve=new THREE.CatmullRomCurve3(pts);
 const geo=new THREE.TubeGeometry(curve,20,0.015,6,false);
 const mat=new THREE.MeshBasicMaterial({color:0xD4AF37,transparent:true,opacity:0.4});
 const tube=new THREE.Mesh(geo,mat); tube.position.set((Math.random()-0.5)*0.6,0.2,(Math.random()-0.5)*0.6); tube.visible=false; roots.push(tube); scene.add(tube);
}

// MERKABITAS - baby merkabas that breed with high freq
const babies=[]; const babyGeo=new THREE.IcosahedronGeometry(0.12,0);
const babyMat=new THREE.MeshPhysicalMaterial({color:0xffffff,metalness:0.1,roughness:0.1,transmission:0.9,iridescence:1,transparent:true,opacity:0.9});

function spawnBaby(){
 if(babies.length>18) return;
 const m=new THREE.Mesh(babyGeo,babyMat.clone());
 const ang=Math.random()*Math.PI*2; const rad=0.9+Math.random()*0.9;
 m.position.set(Math.cos(ang)*rad, Math.sin(ang*0.5)*0.8, Math.sin(ang)*rad);
 m.userData={vel:new THREE.Vector3((Math.random()-0.5)*0.02,Math.random()*0.02, (Math.random()-0.5)*0.02), life:1};
 babies.push(m); scene.add(m); document.getElementById('count').textContent=babies.length;
}

scene.add(new THREE.PointLight(0x00aaff,2.5,10).translateZ(-2));
scene.add(new THREE.PointLight(0xD4AF37,1.8,8).position.set(2,2,2));
scene.add(new THREE.AmbientLight(0x223344,0.6));

// AUDIO
let audioCtx, analyser, dataArr; const audioEl=document.getElementById('audio');
async function initAudio(src){
 audioCtx=new (window.AudioContext||window.webkitAudioContext)(); analyser=audioCtx.createAnalyser(); analyser.fftSize=512; dataArr=new Uint8Array(analyser.frequencyBinCount);
 let s; if(src.mediaStream) s=audioCtx.createMediaStreamSource(src.mediaStream); else { s=audioCtx.createMediaElementSource(src); src.play(); }
 s.connect(analyser); analyser.connect(audioCtx.destination); document.getElementById('life').textContent='ALIVE'; document.getElementById('life').style.color='#7CFC8A';
}
document.getElementById('micBtn').onclick=async()=>{const st=await navigator.mediaDevices.getUserMedia({audio:true}); await initAudio({mediaStream:st}); document.getElementById('micBtn').textContent='● VIVO';};
document.getElementById('file').onchange=e=>{const f=e.target.files[0]; if(!f) return; audioEl.src=URL.createObjectURL(f); audioEl.style.display='block'; audioEl.onplay=async()=>{if(!audioCtx) await initAudio(audioEl);}; audioEl.play();};
function getBands(){ if(!analyser) return {l:0,m:0,h:0}; analyser.getByteFrequencyData(dataArr); const l=dataArr.slice(0,10).reduce((a,b)=>a+b,0)/10/255; const m=dataArr.slice(10,50).reduce((a,b)=>a+b,0)/40/255; const h=dataArr.slice(50,120).reduce((a,b)=>a+b,0)/70/255; return {l,m,h}; }

let t=0;
function anim(){ requestAnimationFrame(anim); t+=0.016;
 const {l,m,h}=getBands();
 document.getElementById('bLow').style.width=l*100+'%'; document.getElementById('bMid').style.width=m*100+'%'; document.getElementById('bHigh').style.width=h*100+'%';
 coreMat.uniforms.time.value=t; coreMat.uniforms.low.value=l; coreMat.uniforms.mid.value=m; coreMat.uniforms.high.value=h;

 if(analyser){
   // BIO DISPLACEMENT
   const pos=core.geometry.attributes.position;
   for(let i=0;i<pos.count;i++){ const ox=origPos[i*3], oy=origPos[i*3+1], oz=origPos[i*3+2]; const dist=Math.sqrt(ox*ox+oy*oy+oz*oz);
     const wave=Math.sin(dist*6+t*2+l*10)* (l*0.35 + m*0.25) + Math.sin(ox*8+t*3)*h*0.2; pos.setXYZ(i, ox*(1+wave), oy*(1+wave), oz*(1+wave));}
   pos.needsUpdate=true; core.geometry.computeVertexNormals();
   core.scale.setScalar(1 + l*0.3); core.rotation.y+=0.005 + m*0.03;

   // ROOTS grow with bass
   roots.forEach((r,idx)=>{ r.visible=l>0.15; if(r.visible){ r.scale.y=0.5 + l*1.5 + Math.sin(t+idx)*0.2; r.material.opacity=0.2+l*0.5; }});

   // BABIES spawn with high
   if(h>0.55 && Math.random()<h*0.3) spawnBaby();
   // Move babies
   babies.forEach((b,i)=>{ b.position.add(b.userData.vel); b.rotation.x+=0.04; b.rotation.y+=0.03; b.userData.life-=0.002; b.material.opacity=b.userData.life; if(b.userData.life<=0){ scene.remove(b); babies.splice(i,1);} });
   if(l<0.05 && h<0.05 && babies.length>0 && Math.random()<0.05){ const b=babies.pop(); if(b) scene.remove(b); } // dies with silence
   document.getElementById('count').textContent=babies.length;
 }else{ core.rotation.y=t*0.2; }

 composer.render();
}
anim();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);});
</script></body></html>
