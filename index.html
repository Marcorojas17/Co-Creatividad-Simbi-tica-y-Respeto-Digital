<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>KRONOS-28-ITZA ◍ 04:40</title>
  <meta name="theme-color" content="#07111f" />
  <style>
    /* ─── TEMA 04:40 GOLD GLASS ─── */
    :root {
      --bg: #07111f;
      --bg-deep: #040a14;
      --gold: #d6a84f;
      --gold-glow: #f2d18a;
      --text: #f5f7fb;
      --text-muted: #9aa8c2;
      --glass-bg: rgba(7, 17, 31, 0.62);
      --glass-blur: 18px;
      --glass-border: 1px solid rgba(214, 168, 79, 0.18);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: var(--bg-deep);
      color: var(--text);
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      overflow: hidden;
    }
    #app {
      width: 100%; height: 100%;
      display: grid; place-items: center;
      padding: 20px; text-align: center;
    }
    .card {
      max-width: 520px; width: 100%;
      padding: 48px 32px 32px;
      border-radius: 28px;
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border: var(--glass-border);
      box-shadow: 0 0 0 1px rgba(214,168,79,0.08) inset,
                  0 24px 80px rgba(0,0,0,0.75),
                  0 0 60px rgba(214,168,79,0.06);
    }
    .kicker {
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--gold);
      opacity: 0.9;
    }
    .title {
      margin-top: 28px;
      font-size: 30px;
      line-height: 1.05;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .title .gold {
      color: var(--gold);
      display: block;
      margin-top: 6px;
      font-weight: 500;
      letter-spacing: 0.04em;
    }
    .copy {
      margin-top: 22px;
      color: var(--text-muted);
      font-size: 13.5px;
      line-height: 1.7;
    }
    .actions {
      margin-top: 32px;
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(18,18,18,0.7);
      color: #c8c8c8;
      padding: 14px 26px;
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: 0.09em;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.25s ease;
    }
    .btn:hover {
      transform: translateY(-1px);
      border-color: rgba(214,168,79,0.5);
      color: var(--gold-glow);
    }
    .btn-primary {
      background: linear-gradient(180deg, #e7c65a 0%, #d6a84f 100%);
      color: #000;
      border-color: var(--gold);
      font-weight: 700;
      box-shadow: 0 6px 24px rgba(214,168,79,0.28);
    }
    .btn-primary:hover {
      background: linear-gradient(180deg, #f2d18a 0%, #e0bf5a 100%);
      box-shadow: 0 10px 32px rgba(214,168,79,0.4);
    }
    .footer {
      margin-top: 28px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 9.5px;
      color: #5a6a7a;
      letter-spacing: 0.08em;
    }
    .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: #5cff7a;
      border-radius: 50%;
      box-shadow: 0 0 8px #5cff7a;
      animation: pulse 2s infinite;
      margin-right: 4px;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    @media (max-width: 480px) {
      .card { padding: 32px 20px 24px; }
      .title { font-size: 24px; }
      .btn { padding: 10px 18px; font-size: 10px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="card">
      <div class="kicker">◍ CO-CREATIVIDAD SIMBIÓTICA</div>
      <div class="title">KRONOS-28-ITZA <span class="gold">04:40</span></div>
      <div class="copy">Respeto Digital. La autoridad tranquila.<br>El lienzo late al ritmo de la señal.</div>

      <div class="actions">
        <a class="btn btn-primary" href="./live3d.html">ENTRAR ◍ LIVE 3D</a>
        <a class="btn" href="./live.html">LIVE</a>
      </div>

      <div class="footer">
        <span><span class="dot"></span> ONLINE • NODO: ITZA-03 • 440Hz</span>
      </div>
    </div>
  </div>
</body>
</html>
