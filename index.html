<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LEGADO 2099 - IMAGEN CODIGO</title><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;background:#020208;overflow:hidden}canvas{position:absolute;inset:0;width:100vw;height:100vh}#ui{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;text-align:center;width:96%}h1{font:900 clamp(3rem,9vw,6.8rem) system-ui;letter-spacing:.32em;background:linear-gradient(#fff 0%,#ffe9a0 45%,#ff8a00 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 24px #ffb700) drop-shadow(0 0 60px #ff00aa);animation:f 4s ease-in-out infinite}@keyframes f{50%{transform:translateY(-14px)}}.s{color:#cbd5e1;letter-spacing:.3em;margin-top:10px;font:400.85rem monospace}.p{color:#d8b4fe;letter-spacing:.35em;margin-top:8px;font:.7rem monospace;text-shadow:0 0 10px #a46bff}.b{margin-top:38px;display:flex;gap:16px;justify-content:center;flex-wrap:wrap}.btn{padding:15px 28px;border-radius:999px;font:900.9rem system-ui;text-decoration:none;transition:.3s}.g{background:linear-gradient(#fff7cc,#ffd86a,#d4af37);color:#000;box-shadow:0 0 30px rgba(255,215,0,.6)}.o{background:rgba(164,107,255,.12);border:1.5px solid #a46bff;color:#e9d5ff;backdrop-filter:blur(8px)}.btn:hover{transform:scale(1.06)}</style></head><body><canvas id="c"></canvas><div id="ui"><h1>LEGADO 2099</h1><div class="s">Marco Valdovinos & The AI Architect</div><div class="p">EL NEXO PRIMORDIAL • IMAGEN HECHA 100% EN CODIGO</div><div class="b"><a class="btn g" href="nexo.html">VER NEXO</a><a class="btn o" href="legado2099.html">4 MINTS</a></div></div><script>
const C=document.getElementById('c'),X=C.getContext('2d');let W,H,D;function R(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;C.style.width=W+'px';C.style.height=H+'px';X.setTransform(D,0,0,D,0,0)}R();addEventListener('resize',R);
const P=[];for(let i=0;i<900;i++){P.push({a:Math.random()*6.28,y:Math.random(),x:Math.random(),h:[28,195,280,45][Math.floor(Math.random()*4)],s:0.6+Math.random()*1.8,ph:Math.random()*6.28})}
let mic=0,an,da;async function micOn(){try{let s=await navigator.mediaDevices.getUserMedia({audio:true});let ac=new AudioContext();let src=ac.createMediaStreamSource(s);an=ac.createAnalyser();an.fftSize=256;src.connect(an);da=new Uint8Array(an.frequencyBinCount)}catch{}}document.body.onclick=micOn;
function draw(t){X.fillStyle='rgba(2,2,8,0.2)';X.fillRect(0,0,W,H);if(an&&da){an.getByteFrequencyData(da);mic=da[12]/255}let cx=W*0.5,cy=H*0.5,time=t*0.0004;
// nebulosa fondo codigo
let grd=X.createRadialGradient(cx,cy*0.6,0,cx,cy*0.6,H);grd.addColorStop(0,'rgba(60,20,120,0.25)');grd.addColorStop(0.3,'rgba(20,10,60,0.15)');grd.addColorStop(1,'rgba(2,2,8,0)');X.fillStyle=grd;X.fillRect(0,0,W,H);
for(let p of P){p.a+=0.006+mic*0.05;p.y-=0.0009+mic*0.006;if(p.y<0)p.y=1;let yy=p.y*H;let spread=(W<700?W*0.22:360)+mic*140+Math.sin(time+p.ph)*12;let x1=cx+Math.sin(p.a+time)*spread;let x2=cx+Math.sin(p.a+Math.PI+time)*spread;
let light=58+mic*25;let col=`hsl(${p.h},100%,${light}%)`;X.shadowBlur=16+mic*24;X.shadowColor=col;X.fillStyle=col;X.beginPath();X.arc(x1,yy,2.1*p.s,0,6.28);X.fill();X.beginPath();X.arc(x2,yy,2.1*p.s,0,6.28);X.fill();X.shadowBlur=0;
if((p.a*7)%1<0.05){X.strokeStyle=`hsla(${p.h},100%,70%,${0.14+mic*0.18})`;X.lineWidth=1;X.beginPath();X.moveTo(x1,yy);X.lineTo(x2,yy);X.stroke();}}
// energia central vertical - como en tu imagen generada
let eg=X.createLinearGradient(cx,0,cx,H);eg.addColorStop(0,`rgba(255,120,20,${0.06+mic*0.12})`);eg.addColorStop(0.3,`rgba(0,212,255,${0.08+mic*0.14})`);eg.addColorStop(0.7,`rgba(255,215,0,${0.08+mic*0.14})`);eg.addColorStop(1,`rgba(180,80,255,${0.06+mic*0.12})`);X.fillStyle=eg;X.fillRect(cx-1.5,0,3,H);
requestAnimationFrame(draw)}draw(0);
</script></body></html>
