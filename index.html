<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LEGADO 2099</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#020208;overflow:hidden;font-family:system-ui}
.hero{position:absolute;inset:0;background:url('https://images.unsplash.com/photo-1532094349884-543bc11b234d?q=80&w=2000') center/cover, radial-gradient(80% 80% at 50% 20%, #1a1033 0%, #020208 70%);filter:saturate(1.3) contrast(1.1)}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.2),rgba(0,0,0,0.7))}
canvas{position:absolute;inset:0;width:100%;height:100%;z-index:2}
.center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;text-align:center;width:95%;max-width:1000px}
h1{font-size:clamp(3rem,10vw,6.5rem);letter-spacing:0.32em;font-weight:900;background:linear-gradient(180deg,#fff,#ffd86a,#ff8a00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 30px #ffb700);animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-12px)}}
.sub{color:#d1d5db;letter-spacing:0.3em;margin-top:14px;font-size:0.9rem}
.purple{color:#d8b4fe;letter-spacing:0.3em;margin-top:10px;text-shadow:0 0 10px #a46bff}
.btns{margin-top:40px;display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.btn{padding:16px 30px;border-radius:999px;font-weight:900;text-decoration:none;transition:0.3s}
.btn-gold{background:linear-gradient(180deg,#fff7cc,#ffd86a,#d4af37);color:#000;box-shadow:0 0 30px rgba(255,215,0,0.5)}
.btn-outline{background:rgba(255,255,255,0.06);border:1.5px solid #a46bff;color:#e9d5ff;backdrop-filter:blur(10px)}
.btn:hover{transform:scale(1.05)}
</style></head><body>
<div class="hero"></div><canvas id="c"></canvas>
<div class="center"><h1>LEGADO 2099</h1><div class="sub">Marco Valdovinos & The AI Architect</div><div class="purple">El Nexo Primordial • El sonido se hace materia</div><div class="btns"><a class="btn btn-gold" href="nexo.html">🧬 VER NEXO</a><a class="btn btn-outline" href="legado2099.html">4 MINTS</a></div></div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');function R(){C.width=innerWidth*2;C.height=innerHeight*2;C.style.width=innerWidth+'px';C.style.height=innerHeight+'px';X.setTransform(2,0,0,2,0,0)}R();addEventListener('resize',R);
let P=[];for(let i=0;i<800;i++)P.push({a:Math.random()*6.28,y:Math.random(),h:[28,195,280,45][i%4],s:Math.random()*1.5+0.5});
let mic=0,an,d;async function micOn(){try{let s=await navigator.mediaDevices.getUserMedia({audio:true});let ac=new AudioContext();let src=ac.createMediaStreamSource(s);an=ac.createAnalyser();an.fftSize=256;src.connect(an);d=new Uint8Array(an.frequencyBinCount)}catch(e){}}document.body.onclick=micOn;
function draw(t){X.fillStyle='rgba(2,2,8,0.22)';X.fillRect(0,0,innerWidth,innerHeight);if(an){an.getByteFrequencyData(d);mic=d[10]/255}let cx=innerWidth/2;for(let p of P){p.a+=0.007+mic*0.05;p.y-=0.001+mic*0.01;if(p.y<0)p.y=1;let y=p.y*innerHeight;let sp=300+mic*100;let x1=cx+Math.sin(p.a+t*0.0005)*sp,x2=cx+Math.sin(p.a+3.14+t*0.0005)*sp;X.shadowBlur=12+mic*20;X.shadowColor=`hsl(${p.h},100%,60%)`;X.fillStyle=`hsl(${p.h},100%,60%)`;X.beginPath();X.arc(x1,y,2*p.s,0,6.28);X.fill();X.beginPath();X.arc(x2,y,2*p.s,0,6.28);X.fill();X.shadowBlur=0}}requestAnimationFrame(draw);draw();
</script></body></html>
