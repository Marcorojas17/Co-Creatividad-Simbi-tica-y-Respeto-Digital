<script>
const c=document.getElementById('bgc'),x=c.getContext('2d');let w,h,dpr;function R(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px';x.setTransform(dpr,0,0,dpr,0,0)}R();addEventListener('resize',R);
let pts=[];const N=750;for(let i=0;i<N;i++)pts.push({a:Math.random()*6.283185,y:Math.random()*1.5-0.15,s:0.4+Math.random()*1.6,hue:[28,195,280,45][Math.floor(Math.random()*4)],phase:Math.random()*6.28});
let mic=0,an,data,vol=0;async function micOn(){try{const s=await navigator.mediaDevices.getUserMedia({audio:true});const ac=new (window.AudioContext||window.webkitAudioContext)();const src=ac.createMediaStreamSource(s);an=ac.createAnalyser();an.fftSize=512;src.connect(an);data=new Uint8Array(an.frequencyBinCount);document.getElementById('micHint').textContent='🔊 AUDIO ACTIVO';}catch(e){}}document.body.addEventListener('click',micOn,{once:true});

for(let p of pts){p.a+=0.006+mic*0.04+Math.sin(p.phase)*0.002;p.y-=0.0012+mic*0.008;if(p.y<-0.25)p.y=1.25;let yy=p.y*h;let sway=Math.sin(time*0.8+p.phase)*15;let spread= (w<700? w*0.18: 280) + mic*120 + Math.sin(time+p.phase)*10;let x1=cx+Math.sin(p.a+time)*spread + sway;let x2=cx+Math.sin(p.a+Math.PI+time)*spread + sway;
// 4 colores: 28 oro-fuego, 195 cyan-agua, 280 violeta-aire, 45 oro-tierra
let sat=90+mic*10;let light=58+mic*22+Math.sin(p.a*2)*8;let col1=`hsl(${p.hue},${sat}%,${light}%)`;let col2=`hsl(${(p.hue+35)%360},${sat}%,65%)`;
x.shadowBlur=14+mic*26;x.shadowColor=col1;x.fillStyle=col1;x.beginPath();x.arc(x1,yy, (p.s)*(1.6+mic*1.5),0,6.283);x.fill();
x.shadowColor=col2;x.fillStyle=col2;x.beginPath();x.arc(x2,yy, (p.s)*(1.6+mic*1.5),0,6.283);x.fill();x.shadowBlur=0;
if((p.a*10)%1<0.06){x.strokeStyle=`hsla(${p.hue},100%,70%,${0.12+mic*0.15})`;x.lineWidth=0.8;x.beginPath();x.moveTo(x1,yy);x.lineTo(x2,yy);x.stroke();}}
// linea central de energia
let eg=x.createLinearGradient(cx,0,cx,h);eg.addColorStop(0,`rgba(255,215,0,${0.04+mic*0.15})`);eg.addColorStop(0.5,`rgba(164,107,255,${0.06+mic*0.18})`);eg.addColorStop(1,`rgba(0,212,255,${0.04+mic*0.12})`);x.fillStyle=eg;x.fillRect(cx-1.2,0,2.4,h);
requestAnimationFrame(draw)}draw(0);
