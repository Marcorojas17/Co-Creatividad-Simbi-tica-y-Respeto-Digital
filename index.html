<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Co-Creatividad Simbiótica ◍</title>
  <meta name="description" content="Co-Creatividad Simbiótica y Respeto Digital — KRONOS-28-ITZA-CYMATIC-ELITE" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="color-scheme" content="dark" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="canonical" href="https://marcorojas17.github.io/Co-Creatividad-Simbiotica-y-Respeto-Digital/" />
  <base href="./" />
  <style>
    :root { --bg:#0a0a0a; --fg:#e8e8e8; --muted:#888; --accent:#d4af37; --border:#1a1a1a; }
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%;background:var(--bg);color:var(--fg);font-family:ui-monospace,monospace;overflow:hidden}
    #app{width:100%;height:100%;display:grid;place-items:center;padding:24px;text-align:center}
   .card{border:1px solid var(--border);border-radius:20px;background:#111;padding:48px 32px;max-width:520px;width:100%}
    h1{font-size:16px;letter-spacing:0.14em;color:var(--accent);font-weight:400}
    h1 span{color:var(--fg)}
    p{color:var(--muted);font-size:13px;line-height:1.7;margin-top:18px}
   .actions{display:flex;gap:10px;justify-content:center;margin-top:32px;flex-wrap:wrap}
   .btn{border:1px solid #333;background:#161616;color:#ccc;padding:12px 22px;border-radius:999px;font-size:11px;letter-spacing:0.1em;cursor:pointer;font-family:inherit;text-decoration:none;transition:.2s}
   .btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
   .btn-primary{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600}
   .btn-primary:hover{background:#e2c05a}
   .footer{margin-top:28px;font-size:10px;color:#444;letter-spacing:0.08em}
   .footer a{color:#555;text-decoration:none}
   .footer a:hover{color:var(--accent)}
  </style>
</head>
<body>
  <div id="app">
    <div class="card">
      <h1>◍ CO-CREATIVIDAD <span>SIMBIÓTICA</span></h1>
      <p><strong style="color:var(--fg)">KRONOS-28-ITZA v0.3.0</strong><br>Respeto Digital. La autoridad tranquila.</p>
      <p>Entra al lienzo. La señal está en vivo.</p>
      <div class="actions">
        <a class="btn btn-primary" href="./live3d.html">ENTRAR ◍ LIVE 3D</a>
        <a class="btn" href="./live.html">LIVE</a>
      </div>
      <div class="footer">
        <div id="status">◍ init — v0.3.0</div>
        <div style="margin-top:8px"><a href="https://github.com/Marcorojas17/Co-Creatividad-Simbiotica-y-Respeto-Digital">GitHub — Marco Rojas</a></div>
      </div>
    </div>
  </div>
  <script>
    (function(){
      const s = document.getElementById('status');
      s.textContent = `◍ ${location.pathname} — ${navigator.onLine? 'online':'offline'} — v0.3.0`;
      if('serviceWorker' in navigator){
        navigator.serviceWorker.register('./sw.js',{scope:'./'})
         .then(r=>console.log('◍ SW:',r.scope))
         .catch(e=>console.warn('SW fail:',e));
      }
      const p = location.pathname;
      if(p.endsWith('/live3d') || p.endsWith('/live')){
        location.replace(p.endsWith('/live3d')? './live3d.html' : './live.html');
      }
    })();
  </script>
  <script>
    (function(l){if(l.search[1]==='/'){var d=l.search.slice(1).split('&').map(function(s){return s.replace(/~and~/g,'&')}).join('?');window.history.replaceState(null,null,l.pathname.slice(0,-1)+d+l.hash)}})(window.location);
  </script>
</body>
</html>
