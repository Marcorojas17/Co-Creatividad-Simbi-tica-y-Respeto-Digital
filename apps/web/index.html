<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CYMATIC // LIVE</title><link rel="stylesheet" href="apps/web/base.css">
<style>.wrap{max-width:1100px;margin:24px auto;padding:0 16px}.monitor{border:1px solid rgba(212,175,55,0.3);background:rgba(255,255,255,0.05);border-radius:16px;padding:20px}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:16px}.card{background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.07);border-radius:10px;padding:14px}#wave{width:100%;height:50px}.bottom{display:flex;gap:10px;justify-content:center;margin-top:16px}button{border:1px solid #D4AF37;background:transparent;color:#e8dcc0;padding:8px 16px;border-radius:8px;cursor:pointer}button.gold{background:#D4AF37;color:#000;font-weight:700}</style></head><body>
<div class="top"><div style="color:#D4AF37;letter-spacing:3px;font-weight:700">CYMATIC // CONTROL</div><nav><a href="index.html" class="active">LIVE</a><a href="history.html">HISTORY</a><a href="nodes.html">NODES</a><a href="analysis.html">ANALYSIS</a><a href="legal.html">LEGAL</a></nav><div style="font-size:11px">ELITE • JD</div></div>
<div class="wrap"><div class="monitor"><div style="display:flex;justify-content:space-between"><h2>LIVE • STREAM MONITOR</h2><div><span style="color:#7CFC8A">● ONLINE</span> <span id="ls" style="color:#666;font-size:11px">LIVE SINCE 00:14:22</span></div></div>
<div class="grid" style="margin-top:16px"><div class="card"><h3 style="color:#D4AF37;font-size:10px">LOG TERMINAL</h3><div id="logs" style="font-family:monospace;font-size:11px;height:180px;overflow:auto;margin-top:8px">[14:03:12] INIT: Sensor array online<br>[14:03:14] SIGNAL: Stable</div></div><div class="card"><h3 style="color:#D4AF37;font-size:10px">SIGNAL METRICS</h3><div>STRENGTH <b id="str" style="color:#D4AF37;float:right">94%</b><div style="height:3px;background:#222;margin-top:4px"><div id="bar" style="width:94%;height:100%;background:#D4AF37"></div></div></div><canvas id="wave"></canvas><div style="font-size:10px;color:#666;margin-top:8px">WAVEFORM • REALTIME</div></div></div></div><div class="bottom"><button id="bP">PAUSE</button><button id="bR" class="gold">RECORD</button><button id="bE">EXPORT</button><button onclick="location.href='history.html'">HISTORY →</button></div></div>
<script>let p=false;let l=862;const logs=document.getElementById('logs');const w=document.getElementById('wave').getContext('2d');let x=0;function d(){if(!p){w.clearRect(0,0,400,50);w.beginPath();w.strokeStyle='#D4AF37';for(let i=0;i<400;i++)w.lineTo(i,25+Math.sin((i+x)/12)*10);w.stroke();x+=2}requestAnimationFrame(d)}d();setInterval(()=>{if(p)return;l++;document.getElementById('ls').textContent='LIVE SINCE '+String(Math.floor(l/3600)).padStart(2,'0')+':'+String(Math.floor(l%3600/60)).padStart(2,'0')+':'+String(l%60).padStart(2,'0');logs.innerHTML+=`<br>[${new Date().toLocaleTimeString()}] SIGNAL: Stable`;document.getElementById('str').textContent=(90+Math.floor(Math.random()*8))+'%';document.getElementById('bar').style.width=document.getElementById('str').textContent},1000);document.getElementById('bP').onclick=()=>{p=!p;document.getElementById('bP').textContent=p?'RESUME':'PAUSE'};document.getElementById('bR').onclick=()=>{alert('◉ Grabando');};document.getElementById('bE').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([logs.innerText]));a.download='logs.txt';a.click();};</script></body></html>
