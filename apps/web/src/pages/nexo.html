<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXO PRIMORDIAL - FIX</title><style>html,body{margin:0;width:100%;height:100%;background:#020208;overflow:hidden}</style><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script></head><body><script type="module">
import * as THREE from "three";
const scene=new THREE.Scene();scene.background=new THREE.Color(0x020208);
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,0.1,100);camera.position.set(0,0.8,4.2);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(renderer.domElement);

// Luz suave
scene.add(new THREE.AmbientLight(0xffd86a,0.6));
const dir=new THREE.DirectionalLight(0xffd700,1.2);dir.position.set(2,4,2);scene.add(dir);

// CONO CORREGIDO - pequeño y arriba, no tapa
const coneGeo=new THREE.ConeGeometry(0.55,0.9,32);coneGeo.translate(0,0.45,0);
const coneMat=new THREE.MeshStandardMaterial({color:0xd4af37,emissive:0x332200,emissiveIntensity:0.3,roughness:0.4});
const cone=new THREE.Mesh(coneGeo,coneMat);cone.position.y=1.85;cone.rotation.x=Math.PI;scene.add(cone);

// ADN - doble helice limpia
const curve1Points=[],curve2Points=[];for(let i=0;i<80;i++){let t=i/80*4*Math.PI;let y=1.6-t*0.55;curve1Points.push(new THREE.Vector3(Math.sin(t)*0.35,y,Math.cos(t)*0.35));curve2Points.push(new THREE.Vector3(Math.sin(t+Math.PI)*0.35,y,Math.cos(t+Math.PI)*0.35));}
const curve1=new THREE.CatmullRomCurve3(curve1Points);const curve2=new THREE.CatmullRomCurve3(curve2Points);
const tube1=new THREE.Mesh(new THREE.TubeGeometry(curve1,120,0.025,12,false),new THREE.MeshStandardMaterial({color:0xffd700,emissive:0xffaa00,emissiveIntensity:0.5}));
const tube2=new THREE.Mesh(new THREE.TubeGeometry(curve2,120,0.025,12,false),new THREE.MeshStandardMaterial({color:0xffd700,emissive:0xffaa00,emissiveIntensity:0.5}));
scene.add(tube1,tube2);

// Puentes
for(let i=0;i<10;i++){let t=i/10;let p1=curve1.getPoint(t),p2=curve2.getPoint(t);let geo=new THREE.CylinderGeometry(0.012,0.012,p1.distanceTo(p2),6);let mesh=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0xffe680}));mesh.position.copy(p1).lerp(p2,0.5);mesh.lookAt(p2);mesh.rotateX(Math.PI/2);scene.add(mesh);}

// Particulas cayendo del cono al ADN
const partGeo=new THREE.BufferGeometry();const partCount=250;const pos=new Float32Array(partCount*3);
for(let i=0;i<partCount;i++){pos[i*3+0]=(Math.random()-0.5)*0.3;pos[i*3+1]=1.5+Math.random()*0.3;pos[i*3+2]=(Math.random()-0.5)*0.3;}partGeo.setAttribute('position',new THREE.BufferAttribute(pos,3));
const partMat=new THREE.PointsMaterial({color:0xffd700,size:0.02,transparent:true,opacity:0.8});const parts=new THREE.Points(partGeo,partMat);scene.add(parts);

function animate(){requestAnimationFrame(animate);tube1.rotation.y+=0.004;tube2.rotation.y+=0.004;parts.rotation.y+=0.002;let p=partGeo.attributes.position;for(let i=0;i<partCount;i++){p.array[i*3+1]-=0.008;if(p.array[i*3+1]< -1.2)p.array[i*3+1]=1.7;}p.needsUpdate=true;renderer.render(scene,camera);}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></body></html>
