<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KRONOS-28-ITZA | LIVE 3D 440Hz</title>
<style>
  :root { --bg:#07111f; --gold:#d6a84f; --gold2:#ffd479; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);overflow:hidden;font-family:JetBrains Mono,monospace;color:var(--gold)}
  #canvas{position:absolute;inset:0;width:100%;height:100%}
  #hud{position:absolute;top:14px;left:14px;z-index:10;background:rgba(7,17,31,.7);backdrop-filter:blur(10px);border:1px solid rgba(214,168,79,.3);padding:10px 14px;border-radius:12px}
  #controls{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:12px;align-items:center;background:rgba(7,17,31,.85);border:1px solid rgba(214,168,79,.4);padding:12px 18px;border-radius:16px;backdrop-filter:blur(12px)}
  button{background:linear-gradient(180deg,var(--gold2),var(--gold));border:none;color:#000;font-weight:800;padding:10px 18px;border-radius:999px;cursor:pointer;box-shadow:0 0 18px rgba(214,168,79,.6)}
  input[type=range]{accent-color:var(--gold);width:140px}
  label{font-size:11px;letter-spacing:.1em}
  #fps{font-size:12px;opacity:.8}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="hud">
  <div>KRONOS-28-ITZA • 440Hz LIVE</div>
  <div id="fps">FPS: -- • FREQ: 440Hz</div>
</div>
<div id="controls">
  <button id="micBtn">🎤 MIC OFF</button>
  <label>GAIN <input id="gain" type="range" min="0" max="2" step="0.01" value="1"></label>
  <label>SPEED <input id="speed" type="range" min="0.2" max="3" step="0.1" value="1.2"></label>
  <label>WAVES <input id="waves" type="range" min="1" max="8" step="1" value="3"></label>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const fpsEl = document.getElementById('fps');
const micBtn = document.getElementById('micBtn');
const gainSl = document.getElementById('gain');
const speedSl = document.getElementById('speed');
const wavesSl = document.getElementById('waves');

let W,H,dpr=window.devicePixelRatio||1;
function resize(){
  W=innerWidth; H=innerHeight;
  canvas.width=W*dpr; canvas.height=H*dpr;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',resize); resize();

let time=0, gain=1, speed=1.2, numWaves=3;
gainSl.oninput=e=>gain=+e.target.value;
speedSl.oninput=e=>speed=+e.target.value;
wavesSl.oninput=e=>numWaves=+e.target.value;

// Audio
let audioCtx, analyser, dataArray, micActive=false;
async function toggleMic(){
  if(!micActive){
    try{
      audioCtx = new (window.AudioContext||window.webkitAudioContext)({sampleRate:48000});
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      const src = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize=1024;
      dataArray = new Uint8Array(analyser.frequencyBinCount);
      src.connect(analyser);
      micActive=true; micBtn.textContent='🎤 MIC ON'; micBtn.style.boxShadow='0 0 24px #d6a84f';
    }catch(e){ alert('Mic no disponible: '+e.message); }
  }else{
    if(audioCtx) audioCtx.close(); micActive=false; micBtn.textContent='🎤 MIC OFF';
  }
}
micBtn.onclick=toggleMic;

// Render
let last=performance.now(), frames=0, fps=0;
function draw(now){
  requestAnimationFrame(draw);
  frames++; if(now-last>500){ fps=Math.round(frames*1000/(now-last)); frames=0; last=now; fpsEl.textContent=`FPS: ${fps} • FREQ: 440Hz • GAIN: ${gain.toFixed(2)}`; }

  time+=0.016*speed;
  ctx.clearRect(0,0,W,H);

  // fondo grid
  ctx.strokeStyle='rgba(214,168,79,0.06)'; ctx.lineWidth=1;
  for(let x=0;x<W;x+=48){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y=0;y<H;y+=48){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  let audioLevel=0;
  if(analyser && micActive){ analyser.getByteFrequencyData(dataArray); audioLevel=dataArray.reduce((a,b)=>a+b,0)/dataArray.length/255; }

  // ondas 440Hz
  for(let w=0;w<numWaves;w++){
    ctx.beginPath();
    ctx.strokeStyle=`hsla(${38+w*6}, 70%, ${60+w*4}%, ${0.9 - w*0.12})`;
    ctx.lineWidth=2.5 - w*0.3;
    ctx.shadowColor='#d6a84f'; ctx.shadowBlur=w===0?18:0;
    for(let x=0;x<W;x+=2){
      const freq = 440/100 * (1 + w*0.18);
      const amp = (H*0.18 + audioLevel*H*0.3) * gain / (1+w*0.4);
      const y = H/2 + Math.sin(x*0.012*freq + time*2.2 + w) * amp * Math.sin(time*0.6 + x*0.005) + Math.cos(x*0.008 + time)*10;
      if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke(); ctx.shadowBlur=0;
  }

  // punto central 04:40
  ctx.fillStyle='#ffd479'; ctx.shadowColor='#d6a84f'; ctx.shadowBlur=20;
  ctx.beginPath(); ctx.arc(W/2, H/2, 6 + Math.sin(time*4)*2 + audioLevel*10, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
}
draw(performance.now());
</script>
</body>
</html>
