openapi: 3.0.3
info:
  title: KRONOS 28 ITZA 289 PLATINUM API
  version: 289.0.0
  description: |
    API de Infraestructura DSP + Cimatica + Sellado Criptografico.
    Cumplimiento: NOM-024, ISO 27001, SBOM.
    SafeCreative: 2607086319439 | Frecuencias 432Hz/528Hz/963Hz
  contact:
    name: Marco A Rojas V
    url: https://co-creatividad-simbi-tica-y-respeto-alpha.vercel.app
    email: marco.a.rojas.v@hotmail.com
  license:
    name: KRONOS_LICENSE_SC.sol
    url: https://github.com/Marcorojas17/Co-Creatividad-Simbi-tica-y-Respeto-Digital

servers:
    - url: https://co-creatividad-simbi-tica-y-respeto-digital-api.vercel.app
    description: Produccion PLATINUM
    - url: http://localhost:3000
    description: Local

security:
    - BearerAuth: []
    - ApiKeyAuth: []

tags:
    - name: DSP Engine
    - name: Cymatics
    - name: Crypto Seal
    - name: Enterprise Compliance

paths:
  /v1/frequency/convert:
    post:
      tags: [DSP Engine]
      summary: Convierte 440Hz -> 432/528/963Hz
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                audio:
                  type: string
                  format: binary
                targetFrequency:
                  type: number
                  enum: [432, 528, 963]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sha256:
                    type: string
                  url:
                    type: string

  /v1/seal/crypto:
    post:
      tags: [Crypto Seal]
      summary: Sellado GPG 4 firmas Gatos Guardianes
      responses:
        '200':
          description: OK

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-KRONOS-API-KEY
