version: '3.8'
services:
  api:
    build: ./apps/api
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/kronos
      - NODE_ENV=production
    depends_on:
      - postgres
  worker:
    build: ./apps/worker
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/kronos
    depends_on:
      - postgres
  web:
    build: ./apps/web
    ports:
      - "8000:80"
  postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=kronos
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
