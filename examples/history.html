<!DOCTYPE html><html><head><meta charset="UTF-8"><title>CYMATIC // HISTORY</title>
<style>
:root{--gold:#D4AF37;--gold2:#F5D76E;--green:#7CFC8A;--red:#FF5A5A;--bg:#080808}
*{margin:0;box-sizing:border-box}body{background:#080808;color:#e8dcc0;font-family:Inter,system-ui;min-height:100vh}
.top{height:56px;display:flex;justify-content:space-between;align-items:center;padding:0 24px;border-bottom:1px solid rgba(212,175,55,0.2);background:rgba(0,0,0,0.7);backdrop-filter:blur(12px);position:sticky;top:0;z-index:10}
.top .brand{color:var(--gold);letter-spacing:3px;font-weight:700} .top a{margin:0 10px;color:#666;text-decoration:none;font-size:12px;letter-spacing:2px;cursor:pointer} .top a.active{color:var(--gold);border-bottom:2px solid var(--gold);padding-bottom:4px}
.wrap{max-width:1100px;margin:30px auto;padding:0 20px}
.hdr{border:1px solid rgba(212,175,55,0.3);background:rgba(255,255,255,0.05);backdrop-filter:blur(20px);border-radius:16px;padding:20px 24px;display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.grid{display:grid;grid-template-columns:280px 1fr;gap:20px}
.card{background:rgba(20,20,20,0.8);border:1px solid rgba(212,175,55,0.15);border-radius:12px;padding:16px}
.card h3{color:var(--gold);font-size:11px;letter-spacing:2px;margin-bottom:14px}
.timeline{position:relative;padding-left:20px;border-left:1px solid rgba(212,175,55,0.2)}
.item{margin-bottom:18px;position:relative;padding:12px;background:rgba(0,0,0,0.4);border-radius:8px;border:1px solid rgba(255,255,255,0.06);cursor:pointer;transition:.2s}
.item:hover{border-color:var(--gold);transform:translateX(4px)}
.item::before{content:'';position:absolute;left:-25px;top:16px;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.item.green::before{background:var(--green);box-shadow:0 0 8px var(--green)} .item.red::before{background:var(--red)}
.badge{font-size:9px;padding:2px 6px;border-radius:10px;background:rgba(212,175,55,0.15);color:var(--gold);border:1px solid var(--gold)}
.chart{display:flex;align-items:end;gap:4px;height:80px;margin:12px 0}
.chart div{flex:1;background:linear-gradient(0deg,var(--gold),var(--gold2));border-radius:3px 3px 0 0;min-height:4px}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.kpi div{background:rgba(0,0,0,0.4);border-radius:8px;padding:10px;text-align:center;border:1px solid rgba(255,255,255,0.05)}
.kpi b{color:var(--gold);font-size:18px;display:block}
#detail{position:sticky;top:90px}
.btn{border:1px solid var(--gold);background:transparent;color:#e8dcc0;padding:8px 14px;border-radius:8px;cursor:pointer;margin-top:8px;width:100%}
.btn.gold{background:var(--gold);color:#000;font-weight:700}
</style></head><body>
<div class="top"><div class="brand">CYMATIC // CONTROL</div><nav><a href="index.html">OVERVIEW</a><a href="index.html">LIVE</a><a class="active">HISTORY</a><a href="nodes.html">NODES</a><a href="analysis.html">ANALYSIS</a></nav><div style="font-size:11px">ELITE • ARCHIVE MODE</div></div>
<div class="wrap">
<div class="hdr"><div><h2 style="letter-spacing:2px">HISTORY • SIGNAL ARCHIVE</h2><p style="color:#666;font-size:12px;margin-top:4px">Últimos 7 días • 1,248 eventos registrados • 98.2% uptime</p></div><div style="text-align:right"><div style="font-size:11px;color:#888">RANGO</div><select id="range" style="background:#111;color:var(--gold);border:1px solid var(--gold);padding:6px 10px;border-radius:6px"><option>24H</option><option selected>7 DÍAS</option><option>30 DÍAS</option></select></div></div>

<div class="grid">
<div class="card">
<h3>📈 ESTABILIDAD 7D</h3>
<div class="chart" id="chart"></div>
<div class="kpi"><div><b>1,248</b><span style="font-size:10px;color:#888">EVENTOS</span></div><div><b>98.2%</b><span style="font-size:10px;color:#888">UPTIME</span></div><div><b>3</b><span style="font-size:10px;color:#888">ANOMALÍAS</span></div><div><b>12ms</b><span style="font-size:10px;color:#888">AVG LAT</span></div></div>
<h3 style="margin-top:16px">🔍 FILTROS</h3>
<div style="display:flex;gap:6px;flex-wrap:wrap"><span class="badge" style="cursor:pointer" onclick="filterLogs('all')">ALL</span><span class="badge" style="cursor:pointer" onclick="filterLogs('stable')">STABLE</span><span class="badge" style="cursor:pointer" onclick="filterLogs('anomaly')">ANOMALY</span><span class="badge" style="cursor:pointer" onclick="filterLogs('node')">NODE</span></div>
<button class="btn gold" id="exportAll">⬇ EXPORTAR TODO .CSV</button>
</div>

<div class="card">
<h3>🕒 TIMELINE • EVENTOS</h3>
<div class="timeline" id="timeline"></div>
</div>
</div>
</div>

<div id="detailModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(10px);z-index:99;align-items:center;justify-content:center"><div class="card" style="width:90%;max-width:500px"><h3 id="mTitle">DETALLE</h3><pre id="mBody" style="background:#000;padding:12px;border-radius:8px;font-size:11px;white-space:pre-wrap;margin:12px 0"></pre><button class="btn" onclick="document.getElementById('detailModal').style.display='none'">CERRAR</button></div></div>

<script>
const events=[
{t:'2025-11-22 14:03:17',type:'stable',msg:'SIGNAL: Stable - 42.3dB',node:'Node-07',d:'SNR óptimo, noise floor -96dB. Conexión simbiótica estable.'},
{t:'2025-11-22 13:45:02',type:'node',msg:'PATH: Node-07 → Node-12 active',node:'Node-12',d:'Handshake completo. Latencia 12ms. Transferencia 128KB.'},
{t:'2025-11-22 11:20:15',type:'anomaly',msg:'ANOMALY: Spike 3.2dB detectado',node:'Node-03',d:'Pico anómalo en 440Hz. Auto-corregido en 2.3s.'},
{t:'2025-11-21 22:14:33',type:'stable',msg:'CAL: Calibration complete - bias null',node:'System',d:'Calibración diaria completada. Bias <0.01%'},
{t:'2025-11-21 18:03:11',type:'stable',msg:'SIGNAL: Stable - 41.8dB',node:'Node-07',d:'Estabilidad 94% mantenida por 6h continuas.'},
{t:'2025-11-20 09:12:45',type:'node',msg:'NODE_JOIN: Node-08 online',node:'Node-08',d:'Nuevo nodo de co-creatividad registrado. IPFS hash: Qm...'},
{t:'2025-11-19 16:44:02',type:'anomaly',msg:'LATENCY: 89ms - degradado',node:'Node-05',d:'Latencia elevada por congestión. Resuelto con reroute.'},
];
function render(list){const tl=document.getElementById('timeline'); tl.innerHTML=''; list.forEach(e=>{const d=document.createElement('div'); d.className=`item ${e.type==='stable'?'green':e.type==='anomaly'?'red':''}`; d.innerHTML=`<div style="display:flex;justify-content:space-between"><span style="font-size:10px;color:#888">${e.t}</span><span class="badge">${e.node}</span></div><div style="margin:6px 0;font-size:12px">${e.msg}</div>`; d.onclick=()=>{document.getElementById('mTitle').textContent=e.msg; document.getElementById('mBody').textContent=`TIMESTAMP: ${e.t}\nNODE: ${e.node}\nTYPE: ${e.type}\n\nDETALLE:\n${e.d}\n\nRAW:\n${JSON.stringify(e,null,2)}`; document.getElementById('detailModal').style.display='flex'}; tl.appendChild(d)})}
function filterLogs(f){if(f==='all')render(events);else render(events.filter(e=>e.type===f))}
render(events);
const chart=document.getElementById('chart'); for(let i=0;i<20;i++){const b=document.createElement('div'); b.style.height=(20+Math.random()*60)+'px'; chart.appendChild(b)}
document.getElementById('exportAll').onclick=()=>{let csv='timestamp,type,node,message\n'; events.forEach(e=>csv+=`${e.t},${e.type},${e.node},"${e.msg}"\n`); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='cymatic_history.csv'; a.click()}
document.getElementById('range').onchange=(e)=>{const v=e.target.value; document.querySelector('.hdr p').textContent=`Últimos ${v} • ${v==='24H'?342:v==='7 DÍAS'?1248:4820} eventos • 98.2% uptime`};
</script>
</body></html>
