<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIAMANTE • NÚCLEO ETERNO</title>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<style>body{margin:0;background:#000;overflow:hidden;font-family:Inter}
.top{position:fixed;top:0;left:0;right:0;height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;background:rgba(0,0,0,0.7);border-bottom:1px solid rgba(100,0,255,0.3);z-index:10}
#btn{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:14px 28px;border-radius:28px;border:1px solid #A855F7;background:linear-gradient(90deg,#A855F7,#D4AF37);color:#fff;font-weight:900;cursor:pointer;z-index:10}
#hash{position:fixed;right:12px;top:56px;background:rgba(0,0,0,0.8);border:1px solid #A855F7;border-radius:12px;padding:10px;font-size:9px;color:#A855F7;width:220px;z-index:10;word-break:break-all}
</style></head><body>
<div class="top"><div style="color:#A855F7;font-weight:800">DIAMANTE • NÚCLEO ETERNO • 963Hz</div><div style="font-size:9px;color:#666">Presión de sonido → Carbón → Diamante</div><div><a href="legacy2099.html" style="color:#888;text-decoration:none;font-size:10px">← LEGADO</a></div></div>
<button id="btn">💎 PRESIONA Y CANTA PARA CREAR TU DIAMANTE</button>
<div id="hash">SHA-256: esperando tu voz para acuñar diamante...</div>
<script type="module">
import * as THREE from 'three'; import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js'; import { RenderPass } from 'three/addons/postprocessing/RenderPass.js'; import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
const scene=new THREE.Scene(); const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,100); camera.position.set(0,0.5,3.8);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,1.5)); renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1; document.body.appendChild(renderer.domElement);
const composer=new EffectComposer(renderer); composer.addPass(new RenderPass(scene,camera)); composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.6,0.3,0.2));
// circuit floor
const floor=new THREE.Mesh(new THREE.PlaneGeometry(10,10), new THREE.MeshStandardMaterial({color:0x0a0a0a,emissive:0x332200,emissiveIntensity:0.2})); floor.rotation.x=-Math.PI/2; floor.position.y=-1.2; scene.add(floor);
for(let i=0;i<30;i++){const l=new THREE.Mesh(new THREE.BoxGeometry(Math.random()*2+0.5,0.02,0.02), new THREE.MeshBasicMaterial({color:i%3==0?0x00aaff:0xD4AF37})); l.position.set((Math.random()-0.5)*6,-1.19,(Math.random()-0.5)*6); scene.add(l);}
// DIAMOND
const diamondGeo=new THREE.OctahedronGeometry(1,0); const diamondMat=new THREE.MeshPhysicalMaterial({color:0xffffff,metalness:0.1,roughness:0.05,transmission:0.95,thickness:0.5,ior:2.4,iridescence:0.6,clearcoat:1}); const diamond=new THREE.Mesh(diamondGeo,diamondMat); scene.add(diamond);
// CORE purple
const core=new THREE.Mesh(new THREE.SphereGeometry(0.25,32,32), new THREE.MeshBasicMaterial({color:0xA855F7})); const coreLight=new THREE.PointLight(0xA855F7,3,4); core.add(coreLight); diamond.add(core);
scene.add(new THREE.AmbientLight(0xffffff,0.6)); scene.add(new THREE.DirectionalLight(0xffffff,1).position.set(2,3,2));

let analyser,data,audioCtx; const btn=document.getElementById('btn'); const hashEl=document.getElementById('hash');
btn.onclick=async()=>{ const s=await navigator.mediaDevices.getUserMedia({audio:true}); audioCtx=new AudioContext(); analyser=audioCtx.createAnalyser(); analyser.fftSize=512; data=new Uint8Array(analyser.frequencyBinCount); audioCtx.createMediaStreamSource(s).connect(analyser); btn.textContent='● TU DIAMANTE LATe'; generateHash(); };
async function generateHash(){ const raw=Date.now()+Math.random()+''; const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(raw)); const h=Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join(''); hashEl.innerHTML=`DIAMANTE ACUÑADO<br>0x${h.slice(0,16)}...<br><br>SHA-256:<br>${h}<br><br><span style="color:#D4AF37">VERDE //1 • ETERNO</span><br>${new Date().toLocaleString()}`; }
let t=0; function anim(){ requestAnimationFrame(anim); t+=0.016; let l=0,m=0,h=0; if(analyser){ analyser.getByteFrequencyData(data); l=data.slice(0,10).reduce((a,b)=>a+b,0)/10/255; m=data.slice(10,60).reduce((a,b)=>a+b,0)/50/255; h=data.slice(60,150).reduce((a,b)=>a+b,0)/90/255; core.scale.setScalar(1+l*0.8+h*0.6); coreLight.intensity=2+h*5+m*2; diamond.scale.setScalar(1+l*0.15+h*0.1); diamond.rotation.y+=0.005+m*0.02; } else diamond.rotation.y=t*0.2; composer.render(); } anim();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);});
</script></body></html>
