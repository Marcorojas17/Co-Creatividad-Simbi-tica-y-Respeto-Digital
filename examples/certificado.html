<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Certificado Kronos</title>
<style>body{background:#000;color:#D4AF37;font-family:monospace;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{width:400px;border:2px solid #00ff88;border-radius:16px;padding:24px;background:rgba(0,20,10,0.9);box-shadow:0 0 40px rgba(0,255,136,0.3)}
.hash{font-size:9px;color:#00ccff;word-break:break-all;background:#000;padding:8px;border-radius:6px;margin:8px 0}</style></head><body>
<div class="card">
<div style="text-align:center;letter-spacing:3px">PROTOCOLO KRONOS • VERDE //1</div>
<div id="status" style="font-size:36px;text-align:center;color:#00ff88;margin:12px 0">VERDE //1</div>
<div style="font-size:11px">Titular: <span id="name">Visitante Kifos</span></div>
<div style="font-size:11px">Frecuencia Madre: <span id="freq">528 Hz</span></div>
<div class="hash" id="hash">SHA-256: calculando...</div>
<button onclick="generate()" style="width:100%;padding:10px;background:#00ff88;border:none;border-radius:20px;font-weight:800;cursor:pointer;margin-top:10px">GENERAR MI HASH AUTÉNTICO</button>
<div style="font-size:8px;color:#666;margin-top:8px;text-align:center">Registrado en blockchain Ethereum Toluca Nodo 07</div>
</div>
<script>
async function sha256(msg){const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg)); return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');}
async function generate(){const name=prompt('Tu nombre:')||'Visitante Kifos'; document.getElementById('name').textContent=name; const freq=(Math.random()*400+100).toFixed(2); document.getElementById('freq').textContent=freq+' Hz'; const raw=name+freq+Date.now()+navigator.userAgent; const h=await sha256(raw); document.getElementById('hash').innerHTML=`SHA-256: ${h}<br>0x${h.slice(0,10)}... VERIFICADO<br>TIMESTAMP: ${new Date().toISOString()}`;}
</script></body></html>
