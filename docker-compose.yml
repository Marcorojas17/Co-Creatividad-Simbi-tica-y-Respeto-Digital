version: '3.9'
services:
  # ----- DB -----
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports: ['5432:5432']
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kronos_db}
      POSTGRES_USER: ${POSTGRES_USER:-kronos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kronos_0440_platinum}
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck: { test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-kronos} -d ${POSTGRES_DB:-kronos_db}'], interval: 10s, timeout: 5s, retries: 5 }
    networks: [kronos-net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ['6379:6379']
    command: redis-server --appendonly yes
    healthcheck: { test: ['CMD', 'redis-cli', 'ping'], interval: 10s, timeout: 3s, retries: 5 }
    networks: [kronos-net]

  # ----- API -----
  api:
    build: { context: ., dockerfile: ./apps/api/Dockerfile }
    ports: ['${API_PORT:-4000}:4000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL:-postgres://kronos:kronos_0440_platinum@postgres:5432/kronos_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET}
      API_KEY: ${API_KEY}
      PORT: 4000
    healthcheck: { test: ['CMD', 'node', 'healthcheck.js'], interval: 30s, timeout: 5s, retries: 3 }
    networks: [kronos-net]

  # ----- DSP - Tu motor 440Hz -----
  dsp:
    build: { context: ., dockerfile: ./core-dsp/Dockerfile }
    depends_on: [api, redis]
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NEXT_PUBLIC_FREQUENCY: ${NEXT_PUBLIC_FREQUENCY:-440}
      API_KEY: ${API_KEY}
    healthcheck: { test: ['CMD', 'python', '-c', 'import sys; sys.exit(0)'], interval: 30s }
    networks: [kronos-net]

  # ----- WEB -----
  web:
    build: { context: ., dockerfile: ./apps/web/Dockerfile, args: { NEXT_PUBLIC_FREQUENCY: ${NEXT_PUBLIC_FREQUENCY:-440} } }
    ports: ['${WEB_PORT:-3000}:3000']
    depends_on:
      api: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      NEXT_PUBLIC_FREQUENCY: ${NEXT_PUBLIC_FREQUENCY:-440}
      JWT_SECRET: ${JWT_SECRET}
      WEB_PORT: ${WEB_PORT:-3000}
    healthcheck: { test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health'], interval: 30s, timeout: 5s, retries: 3 }
    networks: [kronos-net]

networks:
  kronos-net: { driver: bridge, name: kronos-28-itza-net }

volumes:
  postgres-data: { name: kronos-pg-data }
